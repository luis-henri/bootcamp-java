<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2>Cadastrar Novo Usuário</h2>
    <form th:action="@{${usuario.id == null ? '/usuarios_salvar' : '/usuarios_editar_salvar'}}"
          th:object="${usuario}" method="POST" class="mt-4">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label">Nome:</label>
            <input type="text" th:field="*{nome}" class="form-control" required placeholder="Digite o nome do usuário">
        </div>

        <div class="mb-3">
            <label class="form-label">Email:</label>
            <input type="email" th:field="*{email}" class="form-control" required placeholder="email@exemplo.com">
        </div>

        <button type="submit" class="btn btn-success">Salvar Usuário</button>
        <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
